<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ana Gym Quest - A Odisseia do Ferro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c081e;
      --card: #181232;
      --card-border: #3b2b6e;
      --pink: #ff2a85;
      --yellow: #ffd700;
      --green: #00ffcc;
      --purple: #9b51e0;
      --blue: #00bfff;
      --red: #ff4757;
      --white: #ffffff;
      --muted: #938cb5;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: 'Rajdhani', system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--white); 
      margin: 0; 
      padding: 12px;
      background-image: 
        radial-gradient(var(--purple) 1.5px, transparent 1.5px),
        radial-gradient(var(--pink) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      background-color: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    .container { 
      max-width: 100%; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }
    
    .card { 
      background: var(--card); 
      border: 3px solid var(--purple); 
      border-radius: 16px; 
      padding: 16px; 
      box-shadow: 0 8px 25px rgba(155, 81, 224, 0.3); 
    }

    .card-reward {
      border: 3px solid var(--yellow);
      background: linear-gradient(135deg, #181232 0%, #341f47 100%);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
    }

    .main-title {
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      font-size: 0.8rem;
      color: var(--yellow);
      margin-bottom: 6px;
      text-transform: uppercase;
      line-height: 1.4;
      text-shadow: 2px 2px var(--pink);
    }

    .subtitle-fun {
      text-align: center;
      font-size: 0.9rem;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header { 
      font-family: 'Press Start 2P', monospace;
      text-align: center; 
      font-size: 0.85rem; 
      color: var(--blue); 
    }

    .rules-toggle {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--yellow);
      text-align: center;
      padding: 8px;
      background: rgba(255, 215, 0, 0.1);
      border: 2px dashed var(--yellow);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      user-select: none;
    }

    .rules-content {
      display: none;
      font-size: 0.85rem;
      color: #f3e8ff;
      line-height: 1.4;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--card-border);
    }

    .rules-content ul {
      margin: 4px 0 0 0;
      padding-left: 18px;
    }

    .rules-content li {
      margin-bottom: 4px;
    }

    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    
    .stat-box { 
      background: rgba(0, 0, 0, 0.4); 
      border: 2px solid var(--card-border);
      padding: 10px 6px; 
      border-radius: 10px; 
      text-align: center; 
    }
    
    .stat-val { 
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem; 
      color: var(--white);
      margin-bottom: 4px;
    }

    .stat-lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }

    /* Grelha fixa de Segunda a Domingo */
    .week-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 10px;
    }

    .day-cell {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 2px;
      text-align: center;
    }

    .day-cell.today {
      border-color: var(--yellow);
      background: rgba(255, 215, 0, 0.1);
    }

    .day-cell-name {
      font-size: 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .day-cell.today .day-cell-name {
      color: var(--yellow);
    }

    .day-cell-status {
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .progress-bg { 
      background: rgba(0, 0, 0, 0.6); 
      border: 2px solid var(--card-border);
      border-radius: 8px; 
      height: 16px; 
      overflow: hidden; 
      margin-top: 10px; 
      padding: 2px;
    }
    
    .progress-fill { 
      background: linear-gradient(90deg, var(--purple), var(--green)); 
      height: 100%; 
      width: 0%; 
      border-radius: 5px;
      transition: width 0.4s ease; 
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .btn { 
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.03); 
      color: var(--white); 
      border: 2px
